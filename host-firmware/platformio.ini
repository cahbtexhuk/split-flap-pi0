[env:wemos_d1_mini32]
platform = espressif32@~6.9.0
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    ; 1 = mirror the console log to Serial (115200 baud)
    -DENABLE_SERIAL_LOG=0
    -DI2C_SDA_PIN=21
    -DI2C_SCL_PIN=22
    -DI2C_CLOCK_HZ=100000
    ; Upper bound of the speed byte accepted by Unit firmware (stepper.setSpeed argument)
    -DMAX_ROTATION_SPEED=255
