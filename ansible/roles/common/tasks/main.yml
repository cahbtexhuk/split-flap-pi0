---
- name: Ensure passwordless sudo for split-flap user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ sudo_nopasswd_user }}"
    content: "{{ sudo_nopasswd_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: Run apt update and upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: "yes"

- name: Install required apt packages
  ansible.builtin.apt:
    name: "{{ apt_common_packages }}"
    state: present

- name: Configure log2ram size
  ansible.builtin.lineinfile:
    path: /etc/log2ram.conf
    regexp: "^SIZE="
    line: "SIZE={{ log2ram_size }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart log2ram

- name: Enable and start log2ram service
  ansible.builtin.systemd:
    name: log2ram
    enabled: true
    state: started
    daemon_reload: true

- name: Install I2C apt packages
  ansible.builtin.apt:
    name: "{{ i2c_apt_packages }}"
    state: present
    
- name: Add split-flap user to i2c group
  ansible.builtin.user:
    name: split-flap
    groups: i2c
    append: true

- name: Install and configure WSGI service
  ansible.builtin.include_tasks: install_wsgi.yml

- name: Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - bluetooth.service
    - hciuart.service
    - triggerhappy.service
    - ModemManager.service
    - alsa-state.service
  register: disable_unnecessary_services
  failed_when:
    - disable_unnecessary_services is failed
    - "'Could not find the requested service' not in disable_unnecessary_services.msg"

- name: Set virtual memory swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: true

- name: Check /boot/firmware/config.txt
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: boot_firmware_config

- name: Check /boot/config.txt
  ansible.builtin.stat:
    path: /boot/config.txt
  register: boot_config

- name: Select Raspberry Pi boot config path
  ansible.builtin.set_fact:
    pi_boot_config_path: "{{ '/boot/firmware/config.txt' if boot_firmware_config.stat.exists else '/boot/config.txt' }}"

- name: Disable HDMI output in Raspberry Pi boot config
  ansible.builtin.lineinfile:
    path: "{{ pi_boot_config_path }}"
    regexp: "^hdmi_blanking="
    line: "hdmi_blanking=2"
    create: true
    mode: "0644"

- name: Enable I2C in Raspberry Pi boot config
  ansible.builtin.lineinfile:
    path: "{{ pi_boot_config_path }}"
    regexp: "^dtparam=i2c_arm="
    line: "dtparam=i2c_arm=on"
    create: true
    mode: "0644"

- name: Ensure i2c-dev module is loaded at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/i2c.conf
    content: "i2c-dev\n"
    owner: root
    group: root
    mode: "0644"

- name: Load i2c-dev module now
  ansible.builtin.command: modprobe i2c-dev
  changed_when: false

- name: Enable hardware watchdog in Raspberry Pi boot config
  ansible.builtin.lineinfile:
    path: "{{ pi_boot_config_path }}"
    regexp: "^dtparam=watchdog="
    line: "dtparam=watchdog=on"
    create: true
    mode: "0644"

- name: Ensure bcm2835_wdt module is loaded at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/bcm2835_wdt.conf
    content: "bcm2835_wdt\n"
    owner: root
    group: root
    mode: "0644"

- name: Load bcm2835_wdt module now
  ansible.builtin.command: modprobe bcm2835_wdt
  changed_when: false

- name: Configure watchdog device
  ansible.builtin.lineinfile:
    path: /etc/watchdog.conf
    regexp: "^#?watchdog-device"
    line: "watchdog-device = /dev/watchdog"

- name: Enable and start watchdog service
  ansible.builtin.systemd:
    name: watchdog
    enabled: true
    state: started
