; PlatformIO project wrapper for the split-flap Arduino Nano firmware.
; Source sketches are copied verbatim from the split-flap repo (kept read-only) - see README.md.

[platformio]
default_envs = unit

[env]
platform = atmelavr
framework = arduino
board = nanoatmega328new
monitor_speed = 115200
upload_port = COM3

[env:unit]
build_src_filter = +<unit/*.cpp>
lib_deps = arduino-libraries/Stepper@^1.1.3

[env:eeprom_offset]
build_src_filter = +<eeprom_offset/*.cpp>

